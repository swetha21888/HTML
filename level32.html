<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <div>
        <label for="Name">Name:</label>
        <input type="Text" id="Name" Name="Name" placeholder="Write your name"><br><br>
        <label for="Email">Email:</label>
        <input type="Text" id="Email" Name="Name" placeholder="Write your email">
    </div>
    <div>
        <label for="Message">Message:</label><br>
        <textarea name="Message" id="Message"></textarea>
    </div>
    <div>
        <label for=Rating>Rate us out of 5:</label><br>
        <input type="radio" id="1" name="Rating">
        <label for="Rating">1</label><br>
        <input type="radio" id="2" name="Rating">
        <label for="Rating">2</label><br>
        <input type="radio" id="3" name="Rating">
        <label for="Rating">3</label><br>
        <input type="radio" id="4" name="Rating">
        <label for="Rating">4</label><br>
        <input type="radio" id="5" name="Rating">
        <label for="Rating">5</label>
    </div><br>
    <div>
    <Button>Send your message!</Button>
    </div>
</body>
</html>
